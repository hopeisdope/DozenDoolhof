<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="hero" aria-hidden="true">
  <!--
    The construction worker. Three views share one rig:
      front (facing down, also idle), back (facing up) and side (facing right;
      facing left mirrors it in CSS).
    Animated parts: hero__body (bob), hero__leg-a/b (walk), hero__arm (swing),
    hero__arms-idle / hero__arms-push (pose). Light comes from the top-left.
    The head groups are scaled up around the neck for chibi proportions.
  -->
  <defs>
    <linearGradient id="hero-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9b3"/><stop offset="1" stop-color="#f3ab7d"/>
    </linearGradient>
    <linearGradient id="hero-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e5500f"/>
    </linearGradient>
    <linearGradient id="hero-pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8cf0"/><stop offset="1" stop-color="#2353b5"/>
    </linearGradient>
    <linearGradient id="hero-shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5130"/><stop offset="1" stop-color="#4e2812"/>
    </linearGradient>
    <linearGradient id="hero-helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe866"/><stop offset="0.6" stop-color="#ffc61a"/>
      <stop offset="1" stop-color="#f0a400"/>
    </linearGradient>
    <linearGradient id="hero-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d4524"/><stop offset="1" stop-color="#55290f"/>
    </linearGradient>
  </defs>

  <ellipse class="hero__shadow" cx="50" cy="92" rx="23" ry="5" fill="#1d0c04" fill-opacity="0.3"/>

  <g class="hero__body" stroke="#3b1d0e" stroke-width="3" stroke-linejoin="round">
    <!-- Front view (facing down / idle) -->
    <g class="hero__view hero__view--down">
      <g class="hero__leg hero__leg--a">
        <rect x="37" y="69" width="11" height="16" rx="4" fill="url(#hero-pants)"/>
        <ellipse cx="41.5" cy="87.5" rx="8.5" ry="5.5" fill="url(#hero-shoe)"/>
      </g>
      <g class="hero__leg hero__leg--b">
        <rect x="52" y="69" width="11" height="16" rx="4" fill="url(#hero-pants)"/>
        <ellipse cx="58.5" cy="87.5" rx="8.5" ry="5.5" fill="url(#hero-shoe)"/>
      </g>
      <path d="M33 59q0-5 5-5h24q5 0 5 5l2 13H31z" fill="url(#hero-shirt)"/>
      <path d="M31 70h38l.5 5q0 4-4 4h-31q-4 0-4-4z" fill="url(#hero-pants)"/>
      <g class="hero__arms--idle">
        <rect x="25" y="61" width="9" height="12" rx="4.5" fill="url(#hero-skin)"/>
        <circle cx="29.5" cy="74" r="5" fill="url(#hero-skin)"/>
        <ellipse cx="32" cy="60" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
        <rect x="66" y="61" width="9" height="12" rx="4.5" fill="url(#hero-skin)"/>
        <circle cx="70.5" cy="74" r="5" fill="url(#hero-skin)"/>
        <ellipse cx="68" cy="60" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
      </g>
      <g class="hero__arms--push">
        <ellipse cx="32" cy="60" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
        <ellipse cx="68" cy="60" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
        <circle cx="39" cy="67" r="5.5" fill="url(#hero-skin)"/>
        <circle cx="61" cy="67" r="5.5" fill="url(#hero-skin)"/>
      </g>
      <g class="hero__head" stroke-width="2.6" transform="translate(50 57) scale(1.2) translate(-50 -57)">
        <circle cx="30.5" cy="43" r="4.5" fill="url(#hero-skin)"/>
        <circle cx="69.5" cy="43" r="4.5" fill="url(#hero-skin)"/>
        <ellipse cx="50" cy="41" rx="19.5" ry="16.5" fill="url(#hero-skin)"/>
        <path d="M31 41q0-9 19-9.5 19 .5 19 9.5l-3.5 1q-3-5-15.5-5t-15.5 5z" fill="url(#hero-hair)" stroke="none"/>
        <g stroke="none">
          <ellipse cx="43" cy="44" rx="2.8" ry="3.8" fill="#2a1408"/>
          <ellipse cx="57" cy="44" rx="2.8" ry="3.8" fill="#2a1408"/>
          <circle cx="44" cy="42.6" r="1.1" fill="#fff"/>
          <circle cx="58" cy="42.6" r="1.1" fill="#fff"/>
          <ellipse cx="37.5" cy="49.5" rx="3.6" ry="2.2" fill="#ff8a78" fill-opacity="0.55"/>
          <ellipse cx="62.5" cy="49.5" rx="3.6" ry="2.2" fill="#ff8a78" fill-opacity="0.55"/>
          <ellipse cx="50" cy="47.6" rx="1.7" ry="1.2" fill="#e38c62"/>
        </g>
        <path d="M46.5 50.5q3.5 3.5 7 0" fill="none" stroke="#7a2f12" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M28 36a22 21.5 0 0 1 44 0z" fill="url(#hero-helmet)"/>
        <path d="M50 16v19" stroke="#d99100" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M50 17.5v16" stroke="#ffe680" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M38.5 19q-4 7-4 16.5M61.5 19q4 7 4 16.5" fill="none" stroke="#e0a000" stroke-width="1.8"/>
        <path d="M25 36q0-4 6-4h38q6 0 6 4t-6 4H31q-6 0-6-4z" fill="#f2b000"/>
        <path d="M33.5 28q2-7.5 9.5-10" fill="none" stroke="#fff8c4" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Back view (facing up) -->
    <g class="hero__view hero__view--up">
      <g class="hero__leg hero__leg--a">
        <rect x="37" y="69" width="11" height="16" rx="4" fill="url(#hero-pants)"/>
        <ellipse cx="42" cy="86.5" rx="8" ry="5" fill="url(#hero-shoe)"/>
      </g>
      <g class="hero__leg hero__leg--b">
        <rect x="52" y="69" width="11" height="16" rx="4" fill="url(#hero-pants)"/>
        <ellipse cx="58" cy="86.5" rx="8" ry="5" fill="url(#hero-shoe)"/>
      </g>
      <path d="M33 59q0-5 5-5h24q5 0 5 5l2 13H31z" fill="url(#hero-shirt)"/>
      <path d="M31 70h38l.5 5q0 4-4 4h-31q-4 0-4-4z" fill="url(#hero-pants)"/>
      <g class="hero__arms--idle">
        <rect x="25" y="61" width="9" height="12" rx="4.5" fill="url(#hero-skin)"/>
        <circle cx="29.5" cy="74" r="5" fill="url(#hero-skin)"/>
        <ellipse cx="32" cy="60" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
        <rect x="66" y="61" width="9" height="12" rx="4.5" fill="url(#hero-skin)"/>
        <circle cx="70.5" cy="74" r="5" fill="url(#hero-skin)"/>
        <ellipse cx="68" cy="60" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
      </g>
      <g class="hero__arms--push">
        <ellipse cx="32" cy="58" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
        <ellipse cx="68" cy="58" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
      </g>
      <g class="hero__head" stroke-width="2.6" transform="translate(50 57) scale(1.2) translate(-50 -57)">
        <circle cx="30.5" cy="43" r="4.5" fill="url(#hero-skin)"/>
        <circle cx="69.5" cy="43" r="4.5" fill="url(#hero-skin)"/>
        <ellipse cx="50" cy="41" rx="19.5" ry="16.5" fill="url(#hero-hair)"/>
        <path d="M38 50q12 4.5 24 0" fill="none" stroke="#3e1d09" stroke-width="1.4" stroke-opacity="0.6"/>
        <path d="M28 36a22 21.5 0 0 1 44 0z" fill="url(#hero-helmet)"/>
        <path d="M50 16v19" stroke="#d99100" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M50 17.5v16" stroke="#ffe680" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M38.5 19q-4 7-4 16.5M61.5 19q4 7 4 16.5" fill="none" stroke="#e0a000" stroke-width="1.8"/>
        <path d="M27 37q0-4 6-4h34q6 0 6 4t-6 4H33q-6 0-6-4z" fill="#f2b000"/>
        <path d="M33.5 28q2-7.5 9.5-10" fill="none" stroke="#fff8c4" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Side view (facing right) -->
    <g class="hero__view hero__view--side">
      <g class="hero__leg hero__leg--a">
        <g transform="rotate(10 50 72)">
          <rect x="44.5" y="69" width="10.5" height="16" rx="4" fill="#2a4f9e"/>
          <ellipse cx="53" cy="87.5" rx="9" ry="5" fill="#4e2812"/>
        </g>
      </g>
      <g class="hero__arm hero__arm--back">
        <rect x="44" y="60" width="8.5" height="12" rx="4.25" fill="#e89a6c"/>
      </g>
      <rect x="38" y="54" width="25" height="21" rx="9" fill="url(#hero-shirt)"/>
      <g class="hero__leg hero__leg--b">
        <g transform="rotate(-10 50 72)">
          <rect x="45" y="69" width="10.5" height="16" rx="4" fill="url(#hero-pants)"/>
          <ellipse cx="54" cy="87.5" rx="9" ry="5" fill="url(#hero-shoe)"/>
        </g>
      </g>
      <path d="M38 69h25v5q0 5-5 5H43q-5 0-5-5z" fill="url(#hero-pants)"/>
      <g class="hero__arms--idle">
        <g class="hero__arm hero__arm--front">
          <rect x="46" y="61" width="9" height="12" rx="4.5" fill="url(#hero-skin)"/>
          <circle cx="50.5" cy="74" r="5" fill="url(#hero-skin)"/>
          <ellipse cx="50.5" cy="60" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
        </g>
      </g>
      <g class="hero__arms--push">
        <path d="M51 61l19 2" stroke-width="11" stroke-linecap="round"/>
        <path d="M51 61l19 2" stroke="#f8c296" stroke-width="5.5" stroke-linecap="round"/>
        <circle cx="72" cy="63" r="5.5" fill="url(#hero-skin)"/>
        <ellipse cx="50.5" cy="60" rx="6.5" ry="6" fill="url(#hero-shirt)"/>
      </g>
      <g class="hero__head" stroke-width="2.6" transform="translate(53 57) scale(1.2) translate(-53 -57)">
        <circle cx="53" cy="41" r="17.5" fill="url(#hero-skin)"/>
        <path d="M36 41q-1-10 12-11l6 2q-11 3-12 16-4.5 0-6-7z" fill="url(#hero-hair)"/>
        <ellipse cx="45.5" cy="43.5" rx="3.6" ry="4.4" fill="url(#hero-skin)"/>
        <g stroke="none">
          <ellipse cx="62.5" cy="43.5" rx="2.7" ry="3.7" fill="#2a1408"/>
          <circle cx="63.4" cy="42.1" r="1.1" fill="#fff"/>
          <ellipse cx="62" cy="50" rx="3.4" ry="2.1" fill="#ff8a78" fill-opacity="0.55"/>
        </g>
        <ellipse cx="70.5" cy="46.5" rx="2.5" ry="2.1" fill="#f2a679" stroke-width="1.8"/>
        <path d="M63 52.5q3.5 2.5 6.5-.5" fill="none" stroke="#7a2f12" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M32 36a21.5 21.5 0 0 1 43 0z" fill="url(#hero-helmet)"/>
        <path d="M40.5 19q-4 7-4 16.5" fill="none" stroke="#e0a000" stroke-width="1.8"/>
        <path d="M54 16v19" stroke="#d99100" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M54 17.5v16" stroke="#ffe680" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M30 36q0-4 5-4h43q5 0 5 4t-5 4H35q-5 0-5-4z" fill="#f2b000"/>
        <path d="M37.5 28q2-7.5 9.5-10" fill="none" stroke="#fff8c4" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
